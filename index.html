<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi experiencia QR</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .contenedor {
            padding: 30px;
            max-width: 500px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }
        
        h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>🎉 ¡Bienvenido!</h1>
        <p>Has escaneado correctamente el código QR.</p>
        <p>Escucha el mensaje:</p>
        <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Tu navegador no puede reproducir este audio.
        </audio>
        <h2>🎬 Mira el video</h2>
        <video controls playsinline
         style="display: block; width: 100%; height: auto;">
         <source src="video.mp4" type="video/mp4">   
        </video>
    </div>

</body>
</html>
